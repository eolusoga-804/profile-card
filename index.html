<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="" data-profile-meta="description" />
    <meta name="theme-color" content="#f4f6fa" />

    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("profile-card-theme");
          document.documentElement.dataset.theme =
            savedTheme === "dark" ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <title data-profile="pageTitle"></title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link
      rel="stylesheet"
      href="css/components/profile-card/profile-card.css"
    />
    <link
      rel="stylesheet"
      href="css/components/theme-toggle/theme-toggle.css"
    />
    <link
      rel="stylesheet"
      href="css/components/ambient-background/ambient-background.css"
    />
    <link
      rel="stylesheet"
      href="css/components/skill-badges/skill-badges.css"
    />
  </head>

  <body>
    <div class="ambient-background" aria-hidden="true">
      <span
        class="ambient-background__orb ambient-background__orb--blue"
      ></span>
      <span
        class="ambient-background__orb ambient-background__orb--pink"
      ></span>
      <span
        class="ambient-background__orb ambient-background__orb--cyan"
      ></span>
      <span
        class="ambient-background__orb ambient-background__orb--orange"
      ></span>
      <span
        class="ambient-background__orb ambient-background__orb--lime"
      ></span>
    </div>

    <main class="profile-page container-fluid">
      <article class="profile-card" aria-labelledby="profile-name">
        <header class="profile-card__header">
          <img
            class="profile-card__avatar"
            data-profile-image="avatar"
            width="300"
            height="300"
          />

          <p class="profile-card__eyebrow" data-profile="availability"></p>
          <h1
            class="profile-card__name"
            id="profile-name"
            data-profile="name"
          ></h1>
          <p class="profile-card__role" data-profile="role"></p>
          <p class="profile-card__location">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            <span data-profile="location"></span>
          </p>
        </header>

        <section class="profile-card__about" aria-labelledby="about-heading">
          <h2
            class="profile-card__section-title"
            id="about-heading"
            data-profile="aboutHeading"
          ></h2>
          <p class="profile-card__bio" data-profile="aboutText"></p>
        </section>

        <section class="skill-badges" aria-labelledby="skill-badges-heading">
          <h2
            class="skill-badges__heading"
            id="skill-badges-heading"
            data-profile="expertiseHeading"
          ></h2>
          <ul
            class="skill-badges__list"
            data-profile-list="skills"
            aria-label="Core expertise"
          ></ul>
        </section>

        <nav
          class="profile-card__socials"
          data-profile-list="socials"
          aria-label=""
        ></nav>

        <footer
          class="profile-card__actions"
          data-profile-list="actions"
        ></footer>
      </article>

      <button class="theme-toggle" type="button"></button>
    </main>

    <script src="data/profile-config.js"></script>
    <script src="js/render-profile.js"></script>
    <script src="js/render-skills.js"></script>
    <script src="js/theme-toggle.js"></script>
  </body>
</html>
