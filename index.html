<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="" data-profile-meta="description" />
    <meta name="theme-color" content="#f4f6fa" />

    <title data-profile="pageTitle"></title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link
      rel="stylesheet"
      href="css/components/profile-card/profile-card.css"
    />
    <link
      rel="stylesheet"
      href="css/components/theme-toggle/theme-toggle.css"
    />
    <link
      rel="stylesheet"
      href="css/components/ambient-background/ambient-background.css"
    />
  </head>

  <body>
    <div class="ambient-background" aria-hidden="true">
      <span
        class="ambient-background__orb ambient-background__orb--blue"
      ></span>
      <span
        class="ambient-background__orb ambient-background__orb--pink"
      ></span>
      <span
        class="ambient-background__orb ambient-background__orb--cyan"
      ></span>
      <span
        class="ambient-background__orb ambient-background__orb--orange"
      ></span>
      <span
        class="ambient-background__orb ambient-background__orb--lime"
      ></span>
    </div>

    <main class="profile-page">
      <article class="profile-card" aria-labelledby="profile-name">
        <header class="profile-card__header">
          <img
            class="profile-card__avatar"
            data-profile-image="avatar"
            width="300"
            height="300"
          />

          <p class="profile-card__eyebrow" data-profile="availability"></p>
          <h1
            class="profile-card__name"
            id="profile-name"
            data-profile="name"
          ></h1>
          <p class="profile-card__role" data-profile="role"></p>
        </header>

        <section class="profile-card__about" aria-labelledby="about-heading">
          <h2
            class="profile-card__section-title"
            id="about-heading"
            data-profile="aboutHeading"
          ></h2>
          <p class="profile-card__bio" data-profile="aboutText"></p>
        </section>

        <nav
          class="profile-card__socials"
          data-profile-list="socials"
          aria-label=""
        ></nav>

        <footer
          class="profile-card__actions"
          data-profile-list="actions"
        ></footer>
      </article>

      <button class="theme-toggle" type="button"></button>
    </main>

    <script src="data/profile-config.js"></script>
    <script src="js/render-profile.js"></script>
    <script src="js/theme-toggle.js"></script>
  </body>
</html>
